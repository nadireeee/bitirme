version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: codementor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codementor_ai
      POSTGRES_USER: codementor
      POSTGRES_PASSWORD: codementor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codementor_network

  redis:
    image: redis:7-alpine
    container_name: codementor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codementor_network

  ollama:
    image: ollama/ollama:latest
    container_name: codementor_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - codementor_network
    # For GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codementor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://codementor:codementor123@postgres:5432/codementor_ai
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      JWT_SECRET: your-super-secret-jwt-key-here
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - codementor_network
    command: npm run start:dev

  adminer:
    image: adminer:latest
    container_name: codementor_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - codementor_network

  # Ollama Web UI (Optional - for easy model management)
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: codementor_ollama_webui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=your-secret-key-here
    volumes:
      - ollama_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - codementor_network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  ollama_webui_data:

networks:
  codementor_network:
    driver: bridge
